#####################################################################      
#   Trojzubka  Configuration File
#####################################################################

#####################################################################       
#   Include other config files
#####################################################################

[include KAMP_Settings.cfg]                                                  # Načíta nastavenia z KAMP_Settings.cfg
[include KAMP/Adaptive_Meshing.cfg]                                          # Načíta adaptívne meshovanie z KAMP/Adaptive_Meshing.cfg
[include mainsail.cfg]                                                       # Načíta nastavenia z mainsail.cfg
[include KOMB.cfg]                                                           # Načíta nastavenia z KOMB.cfg
[include moonraker_obico_macros.cfg]
[include macros.cfg]
[include AFC/*.cfg]
[include plr.cfg]

#####################################################################       
#   MCU Definitions
#####################################################################

[mcu]                                                                       
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_45002D000651323439333335-if00   # Sériový port hlavného MCU
restart_method: command                                                      # Spôsob reštartu MCU
##--------------------------------------------------------------------

[mcu nhk]                                                                   
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_1E0042000351353032333039-if00        # Sériový port EBB MCU
restart_method: command                                                      # Spôsob reštartu MCU
##--------------------------------------------------------------------


#####################################################################        
#   Printer Settings
#####################################################################

[printer]                                                                   # Hlavná sekcia nastavení tlačiarne
kinematics: corexy                                                          # Typ kinematiky (CoreXY)
max_velocity: 750                                                          # Maximálna rýchlosť pohybu (mm/s)
max_accel: 13000                                                            # Maximálne zrýchlenie (mm/s^2)
max_z_velocity: 20                                                          # Maximálna rýchlosť Z osi (mm/s)
max_z_accel: 350                                                            # Maximálne zrýchlenie Z osi (mm/s^2)
square_corner_velocity: 5.0                                                 # Rýchlosť v rohoch (mm/s)

#####################################################################       
#   X/Y Stepper Settings
#####################################################################

#-------------------------------------------------------------------#                        
##  Y Stepper - Right
#-------------------------------------------------------------------#

[stepper_y]                                                                 # Nastavenie Y motora
step_pin: PF15                                                              # Pin pre krokový signál Y motora
dir_pin: !PF14                                                              # Pin pre smer Y motora (invertovaný)
enable_pin: !PE9                                                            # Pin pre povolenie Y motora (invertovaný)
rotation_distance: 40                                                       # Vzdialenosť na jednu otáčku (mm)
microsteps: 32                                                              # Počet mikrokrokov
full_steps_per_rotation: 400                                                # Počet plných krokov na otáčku
endstop_pin: tmc5160_stepper_y:virtual_endstop                              # Virtuálny endstop cez driver
position_min: 0                                                             # Minimálna pozícia Y
position_endstop: 311                                                       # Pozícia endstopu Y
position_max: 311                                                           # Maximálna pozícia Y
homing_speed: 75                                                            # Rýchlosť homingu Y (mm/s)
homing_retract_dist: 0                                                      # Retrakcia po homingu (mm)
homing_positive_dir: true                                                   # Homing v pozitívnom smere
use_sensorless_homing: true                                                 # Homing bez fyzického endstopu
min_home_dist: 5                                                            # Minimálna vzdialenosť pre homing (mm)

#-------------------------------------------------------------------#                           
# TMC5160 configuration
#-------------------------------------------------------------------#

[tmc5160 stepper_y]                                                         # Nastavenie TMC5160 pre Y
cs_pin: PE11                                                                # Chip select pin pre SPI
spi_software_mosi_pin = PE14                                                
spi_software_miso_pin = PE13                                               
spi_software_sclk_pin = PE12                                               
interpolate: True                                                           # Interpolácia mikrokrokov
diag0_pin: ^!PE10                                                           # DIAG0 pin (invertovaný, pullup)
driver_SGT: 1                                                               # Nastavenie citlivosti sensorless homingu
run_current: 2
home_current: .56                                                           # Prúd pri homingu (A)
current_change_dwell_time: 0.5                                              # Čas na zmenu prúdu (s)
sense_resistor: 0.075                                                       # Hodnota sense rezistora (Ohm)
#stealthchop_threshold: #999999                                               # Prah pre stealthchop (vypnutý)

 
#-------------------------------------------------------------------#      
##  X Stepper - Left
#-------------------------------------------------------------------#

[stepper_x]                                                                 # Nastavenie X motora
step_pin: PB10                                                              # Pin pre krokový signál X motora
dir_pin: !PB11                                                              # Pin pre smer X motora (invertovaný)
enable_pin: !PG0                                                            # Pin pre povolenie X motora (invertovaný)
rotation_distance: 40                                                       # Vzdialenosť na jednu otáčku (mm)
microsteps: 32                                                              # Počet mikrokrokov
full_steps_per_rotation: 400                                                # Počet plných krokov na otáčku
endstop_pin: tmc5160_stepper_x:virtual_endstop                              # Virtuálny endstop cez driver
position_min: 0                                                             # Minimálna pozícia X
position_endstop: 306                                                       # Pozícia endstopu X
position_max: 306                                                           # Maximálna pozícia X
homing_speed: 75                                                            # Rýchlosť homingu X (mm/s)
homing_positive_dir: true                                                   # Homing v pozitívnom smere
use_sensorless_homing: true                                                 # Homing bez fyzického endstopu
min_home_dist: 5                                                            # Minimálna vzdialenosť pre homing (mm)

#-------------------------------------------------------------------#        
# TMC5160 configuration
#-------------------------------------------------------------------#

[tmc5160 stepper_x]                                                         # Nastavenie TMC5160 pre X
cs_pin: PE15                                                                # Chip select pin pre SPI
spi_software_mosi_pin = PE14                                                
spi_software_miso_pin = PE13                                                
spi_software_sclk_pin = PE12                                                
interpolate: True                                                           # Interpolácia mikrokrokov
diag0_pin: ^!PG1                                                            # DIAG0 pin (invertovaný, pullup)
driver_SGT: 1                                                               # Nastavenie citlivosti sensorless homingu
run_current: 2                                                            # Prúd pri behu motora (A)
home_current: .56                                                           # Prúd pri homingu (A)
current_change_dwell_time: 0.5                                              # Čas na zmenu prúdu (s)
sense_resistor: 0.075                                                       # Hodnota sense rezistora (Ohm)
#stealthchop_threshold: #999999                                               # Prah pre stealthchop (vypnutý)


#####################################################################                           
#   Z Stepper Settings
#####################################################################

[stepper_z]                                                                 # Nastavenie hlavného Z motora
step_pin: PD4                                                               # Pin pre krokový signál Z motora
dir_pin: PD3                                                                # Pin pre smer Z motora
enable_pin: !PD7                                                            # Pin pre povolenie Z motora (invertovaný)
rotation_distance: 4                                                        # Vzdialenosť na jednu otáčku (mm)
microsteps: 32                                                              # Počet mikrokrokov
endstop_pin: probe:z_virtual_endstop                                        # Virtuálny endstop cez sondu
position_max: 290                                                           # Maximálna pozícia Z
position_min: -2                                                             # Minimálna pozícia Z
homing_speed: 5                                                             # Rýchlosť homingu Z (mm/s)
second_homing_speed: 3                                                      # Druhá (pomalšia) rýchlosť homingu (mm/s)
homing_retract_dist: 3                                                      # Retrakcia po homingu (mm)

[tmc2209 stepper_z]                                                         # Nastavenie TMC2209 pre Z
uart_pin: PD5                                                               # UART pin pre komunikáciu s driverom
interpolate: false                                                          # Interpolácia mikrokrokov vypnutá
run_current: 0.8                                                            # Prúd pri behu motora (A)
sense_resistor: 0.110                                                       # Hodnota sense rezistora (Ohm)
#stealthchop_threshold: #999999                                               # Prah pre stealthchop (vypnutý)

#---------------------------------------------------#                          
##  Z1 Stepper - Back Left
#---------------------------------------------------#

[stepper_z1]                                                                # Nastavenie Z1 motora (zadný ľavý)
step_pin: PC12                                                              # Pin pre krokový signál Z1 motora
dir_pin: PC11                                                               # Pin pre smer Z1 motora
enable_pin: !PD2                                                            # Pin pre povolenie Z1 motora (invertovaný)
rotation_distance: 4                                                        # Vzdialenosť na jednu otáčku (mm)
microsteps: 32                                                              # Počet mikrokrokov

[tmc2209 stepper_z1]                                                        # Nastavenie TMC2209 pre Z1
uart_pin: PD0                                                               # UART pin pre komunikáciu s driverom
interpolate: false                                                          # Interpolácia mikrokrokov vypnutá
run_current: 0.8                                                            # Prúd pri behu motora (A)
sense_resistor: 0.110                                                       # Hodnota sense rezistora (Ohm)
#stealthchop_threshold: #999999                                               # Prah pre stealthchop (vypnutý)

#---------------------------------------------------#                         
##  Z2 Stepper - Back Right
#---------------------------------------------------#
[stepper_z2]                                                                # Nastavenie Z2 motora (zadný pravý)
step_pin: PC9                                                               # Pin pre krokový signál Z2 motora
dir_pin: PC8                                                                # Pin pre smer Z2 motora
enable_pin: !PC10                                                           # Pin pre povolenie Z2 motora (invertovaný)
rotation_distance: 4                                                        # Vzdialenosť na jednu otáčku (mm)
microsteps: 32                                                              # Počet mikrokrokov

#---------------------------------------------------#                 
## TMC2209 configuration
#---------------------------------------------------#

[tmc2209 stepper_z2]                                                        # Nastavenie TMC2209 pre Z2
uart_pin: PA8                                                               # UART pin pre komunikáciu s driverom
interpolate: false                                                          # Interpolácia mikrokrokov vypnutá
run_current: 0.8                                                            # Prúd pri behu motora (A)
sense_resistor: 0.110                                                       # Hodnota sense rezistora (Ohm)
#stealthchop_threshold: #999999                                               # Prah pre stealthchop (vypnutý)#

#####################################################################     
#   Extruder
#####################################################################

[extruder]                                                                  # Nastavenie extrudéra
step_pin: nhk:PB8                                                        # Pin pre krokový signál extrudéra (na EBB)
dir_pin: nhk:PB9                                                      # Pin pre smer extrudéra (invertovaný, na EBB)
enable_pin: !nhk:PC14                                                    # Pin pre povolenie extrudéra (invertovaný, na EBB)
rotation_distance: 45.67536                                                 # Vzdialenosť na jednu otáčku (mm)
gear_ratio: 9:1                                                             # Prevodový pomer extrudéra
microsteps: 16                                                              # Počet mikrokrokov
full_steps_per_rotation: 200                                                # Počet plných krokov na otáčku
nozzle_diameter: 0.400                                                      # Priemer trysky (mm)
filament_diameter: 1.75                                                     # Priemer filamentu (mm)
heater_pin: nhk:PA7                                                       # Pin pre ohrev trysky (na EBB)
sensor_type: PT1000                                   # Typ teplotného senzora
sensor_pin: nhk:PB12                                                     # Pin pre teplotný senzor (na EBB)
pullup_resistor: 2200                                                       # Pullup rezistor pre senzor (Ohm)
min_temp: 0                                                                # Minimálna teplota extrudéra (°C)
max_temp: 350                                                               # Maximálna teplota extrudéra (°C)
max_power: 1.0                                                              # Maximálny výkon ohrevu (relatívne)
min_extrude_temp: 100                                                       # Minimálna teplota pre extrúziu (°C)
max_extrude_cross_section: 10                                               # Maximálny prierez extrúzie (mm^2)
max_extrude_only_distance: 1000
#control: pid
#pid_kp: 26.213
#pid_ki: 1.304
#pid_kd: 131.721

#---------------------------------------------------#                            
## TMC2209 configuration
#---------------------------------------------------#

[tmc2209 extruder]                                                          # Nastavenie TMC2209 pre extrudér
uart_pin: nhk:PB7
tx_pin: nhk:PB6
interpolate: false                                                          # Interpolácia mikrokrokov vypnutá
run_current: 0.8                                                            # Prúd pri behu motora (A)
sense_resistor: 0.100                                                       # Hodnota sense rezistora (Ohm)
#stealthchop_threshold: #999999                                               # Prah pre stealthchop (vypnutý)

#####################################################################                         
#   Bed Heater
#####################################################################

[heater_bed]                                                                # Nastavenie vyhrievanej podložky
heater_pin: PG11                                                            # Pin pre ohrev podložky
sensor_type: ATC Semitec 104NT-4-R025H42G                                   # Typ teplotného senzora
sensor_pin: PA2                                                             # Pin pre teplotný senzor podložky
pullup_resistor: 2200                                                       # Pullup rezistor pre senzor (Ohm)
max_power: 1                                                                # Maximálny výkon ohrevu (relatívne)
min_temp: 0                                                                 # Minimálna teplota podložky (°C)
max_temp: 150                                                               # Maximálna teplota podložky (°C)
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769                                                 # PID parameter Kd

[auto_tap]
tap_version: CL_CNC


[probe]
pin: !nhk:PC15
x_offset: 0.0
y_offset: 0.0
samples: 1
#z_offset: 0.0


#####################################################################                         
#   Bed Mesh Configuration
#####################################################################

[bed_mesh]                                                                  # Nastavenie meshovania podložky
horizontal_move_z: 5                                                        # Výška Z pri pohybe medzi bodmi (mm)
speed: 250                                                                  # Rýchlosť meshovania (mm/s)
mesh_min: 50, 50                                                            # Minimálne súradnice meshovacej oblasti (X,Y)
mesh_max: 250, 250                                                          # Maximálne súradnice meshovacej oblasti (X,Y)
probe_count: 5, 5                                                           # Počet bodov meshovania (X,Y)
algorithm: bicubic

#####################################################################                            
#   Safe Z Home Configuration
#####################################################################

[safe_z_home]                                                               # Bezpečné domovské nastavenie Z
home_xy_position: 150, 285                                                  # Pozícia XY pre homing Z
z_hop_speed: 25                                                             # Rýchlosť Z hopu (mm/s)
speed: 300                                                                  # Rýchlosť homingu (mm/s)

######################################################################                          
#   Z Tilt Configuration
######################################################################

[z_tilt]                                                                    # Nastavenie Z tilt
z_positions:                                                                # Pozície Z motorov
   -50, 18                                                                  # Pozícia 1 (X,Y)
   150, 348                                                                 # Pozícia 2 (X,Y)
   350, 18                                                                  # Pozícia 3 (X,Y)
points:                                                                     # Body pre tilt kalibráciu
   16, 17                                                                   # Bod 1 (X,Y)
   150, 285                                                                 # Bod 2 (X,Y)
   283, 17                                                                  # Bod 3 (X,Y)
#z_positions:
#   -50, 18
#   150, 348
#   350, 18
#points:
#   30, 5
#   150, 245
#   270, 5

speed: 250
horizontal_move_z: 3
retries: 6
retry_tolerance: 0.005

#####################################################################                          
#   Accelerometer
#####################################################################
[adxl345]
cs_pin: nhk:PB10
spi_software_sclk_pin: nhk:PA5
spi_software_mosi_pin: nhk:PA2
spi_software_miso_pin: nhk:PA6

[resonance_tester]
accel_chip: adxl345
probe_points: 100, 100, 20
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0
probe_points:                                                               # Druhý bod merania (X,Y,Z)
    155, 155, 20

#####################################################################                        
#   Fan Control
#####################################################################


#--------------------------------------------------------------------#  

# Part Cooling Fan
#--------------------------------------------------------------------#

[fan]                                                                       # Nastavenie part cooling ventilátora
pin: nhk:PA15                                                              # Pin pre ventilátor (na EBB)
kick_start_time: 0.5                                                        # Čas na rozbeh ventilátora (s)

#--------------------------------------------------------------------#                          
# Heatsink Fan
#--------------------------------------------------------------------#

[heater_fan hotend_fan]                                                     # Nastavenie ventilátora hotendu
pin: nhk:PD0                                                             # Pin pre ventilátor (na EBB)
max_power: 1.0                                                              # Maximálny výkon (relatívne)
kick_start_time: 0.5                                                        # Čas na rozbeh ventilátora (s)
heater: extruder                                                            # Ventilátor sa riadi podľa extrudéra
heater_temp: 50.0                                                           # Teplota pre zapnutie ventilátora (°C)

#--------------------------------------------------------------------#                          
# temps
#--------------------------------------------------------------------#

[temperature_sensor nhk]
sensor_type: temperature_mcu
sensor_mcu: nhk

[temperature_sensor MCU]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: nhk:PB2
pullup_resistor: 4700
min_temp: 0
max_temp: 100
gcode_id: chamber_th

#--------------------------------------------------------------------#                          
# Controller Fan
#--------------------------------------------------------------------#

[controller_fan controller_fan]                                             # Nastavenie ventilátora elektroniky
pin: PB7                                                                    # Pin pre ventilátor
kick_start_time: 0.5                                                        # Čas na rozbeh ventilátora (s)
heater: heater_bed                                                          # Ventilátor sa riadi podľa podložky

[controller_fan Stepper_A]
pin: PB3                                                                    # Pin pre ventilátor
kick_start_time: 0.5    

[controller_fan Stepper_B]
pin: PF7                                                                    # Pin pre ventilátor
kick_start_time: 0.5 

#--------------------------------------------------------------------#                     
# Exhaust Fan
#--------------------------------------------------------------------#

[heater_fan exhaust_fan]                                                    # Nastavenie odsávacieho ventilátora
pin: PF9                                                                    # Pin pre ventilátor
max_power: 1.0                                                              # Maximálny výkon (relatívne)
shutdown_speed: 0.0                                                         # Rýchlosť po vypnutí (0 = vypnutý)
kick_start_time: 5.0                                                        # Čas na rozbeh ventilátora (s)
heater: heater_bed                                                          # Ventilátor sa riadi podľa podložky
heater_temp: 60                                                             # Teplota pre zapnutie ventilátora (°C)
fan_speed: 1.0                                                              # Rýchlosť ventilátora (relatívne)

#####################################################################                        
#   LED Control
#####################################################################

#--------------------------------------------------------------------#                           
## Case Light
#--------------------------------------------------------------------#

[output_pin caselight]                                                      # Nastavenie osvetlenia skrinky
pin: PE6                                                                    # Pin pre LED pásik
pwm:true                                                                    # PWM riadenie povolené
hardware_pwm: False                                                         # Hardvérové PWM vypnuté
value: 1.0                                                                  # Počiatočná hodnota (svieti naplno)
shutdown_value: 0                                                           # Hodnota po vypnutí (zhasne)
cycle_time: 0.00025                                                         # Dĺžka PWM cyklu (s)

#--------------------------------------------------------------------#                            
## Neopixel RGB Light
#--------------------------------------------------------------------#

[neopixel neopixel]
pin: nhk:PD3                                                      # Počiatočná hodnota bielej
color_order: GRBW         # Typical order is GRB or RGB
initial_RED: 0.6         # Initial state (0.0 - 1.0)
initial_GREEN: 0.39
initial_BLUE: 1.0

[output_pin act_led]
pin: nhk:PC6

#####################################################################                       
#   Save Variables Configuration
#####################################################################

[save_variables]                                                            # Nastavenie ukladania premenných
filename: ~/printer_data/config/variables.cfg                               # Cesta k súboru s premennými

######################################################################                            
#   Force Move Configuration
######################################################################

[force_move]                                                                # Povolenie núteného pohybu
enable_force_move: True                                                     # Povolenie núteného pohybu Z osi

